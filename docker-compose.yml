services:
  vault-broker-mcp:
    build: .
    image: vault-broker-mcp:latest
    container_name: vault-broker-mcp
    restart: unless-stopped
    environment:
      BW_SERVER_URL: ${BW_SERVER_URL}
      BW_CLIENTID: ${BW_CLIENTID}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET}
      BW_MASTERPASSWORD: ${BW_MASTERPASSWORD}
      VAULTWARDEN_ORG_ID: ${VAULTWARDEN_ORG_ID}
      VAULTWARDEN_COLLECTION_ID: ${VAULTWARDEN_COLLECTION_ID}
      MCP_SSE_SECRET: ${MCP_SSE_SECRET}
      # Optioneel: inject_secret (alleen actief als alle drie gezet zijn)
      PORTAINER_URL: ${PORTAINER_URL:-}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
      INJECT_ALLOWED_STACKS: ${INJECT_ALLOWED_STACKS:-}
      # login-tool (Playwright) staat standaard UIT
      ENABLE_LOGIN: ${ENABLE_LOGIN:-false}
    networks:
      - hassio
    ports:
      - "8933:3000"
    # Poort is bereikbaar op het Tailscale-adres van de host, niet via NPM
    # naar het publieke internet — dit is een secrets-gateway. Zie README
    # "Beveiligingsnotities".

networks:
  hassio:
    external: true
